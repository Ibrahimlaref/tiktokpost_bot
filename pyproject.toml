[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "islamic-stories-bot"
version = "0.1.0"
description = "Automated Islamic storytelling content pipeline for TikTok"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",

    # HTTP / APIs
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",

    # Media
    "ffmpeg-python>=0.2.0",
    "elevenlabs>=1.0.0",
    "Pillow>=10.0.0",

    # Browser automation (fallback publisher only)
    "playwright>=1.40.0",

    # Config & utilities
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",

    # Database
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.5.0",
]

[project.scripts]
islamic-bot = "main_pipeline:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
